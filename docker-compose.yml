services:
  graph_database:
    container_name: graph_database
    image: kemele/virtuoso:7-stable
    restart: unless-stopped
    ports:
      - "8890:8890"
    volumes:
      - graph_data:/.data

  sparql_ui:
    container_name: sparql_ui
    image: erikap/yasgui:latest
    restart: unless-stopped
    ports:
      - "8080:80"

  graph_explorer:
    container_name: graph_explorer
    image: public.ecr.aws/neptune/graph-explorer:latest
    restart: unless-stopped
    ports:
      - "8182:80"
      - "8443:443"
    environment:
      - HOST=localhost
      - GRAPH_EXP_HTTPS_CONNECTION=false
      - PROXY_SERVER_HTTPS_CONNECTION=false
    depends_on:
      - graph_database

volumes:
  graph_data:
